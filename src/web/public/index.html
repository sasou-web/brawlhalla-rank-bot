<!DOCTYPE html>
<html lang="fr" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <title>Xray Kaya · Dashboard</title>

    <!-- Icones : onglets, favoris et ecran d'accueil iOS/Android. Generees depuis
         assets/icon-source.webp par `npm run icons`. -->
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/favicon-192.png" sizes="192x192" type="image/png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0e0f11" />
    <meta name="apple-mobile-web-app-title" content="XK Bot" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/style.css" />

    <!-- Socle chargé en premier et de façon bloquante : il applique le thème
         (clair / sombre / système) avant le premier rendu, sans flash. -->
    <script src="/dash-core.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#content">Aller au contenu</a>

    <!-- ══════════ Chargement : silhouette de l'application ══════════ -->
    <div id="loading" class="boot" aria-busy="true">
      <div class="boot-side" aria-hidden="true">
        <div class="skel boot-line w-60"></div>
        <div class="skel boot-line w-80"></div>
        <div class="skel boot-line w-70"></div>
        <div class="skel boot-line w-75"></div>
        <div class="skel boot-line w-65"></div>
      </div>
      <div class="boot-main" aria-hidden="true">
        <div class="skel boot-title"></div>
        <div class="skel boot-line w-40"></div>
        <div class="skel boot-block"></div>
      </div>
      <p class="sr-only" role="status">Chargement du dashboard…</p>
    </div>

    <!-- ══════════ Connexion / accès refusé / erreur de démarrage ══════════ -->
    <div id="login" class="login" hidden>
      <main class="login-card">
        <div class="logo"><img src="/icon-192.png" alt="" width="40" height="40" /></div>
        <h1 class="login-title">Xray Kaya</h1>
        <p class="login-sub">Dashboard d'administration du bot XK.</p>
        <div id="login-error" class="callout callout-danger" role="alert" hidden></div>
        <div id="login-actions" class="login-actions">
          <a class="btn btn-primary btn-lg btn-block" href="/login">
            <svg class="i" viewBox="0 0 127 96" aria-hidden="true" width="18" height="14">
              <path
                fill="currentColor"
                d="M107.7 8.07A105.15 105.15 0 0 0 81.47 0a72.06 72.06 0 0 0-3.36 6.83 97.68 97.68 0 0 0-29.11 0A72.37 72.37 0 0 0 45.64 0a105.89 105.89 0 0 0-26.25 8.09C2.79 32.65-1.71 56.6.54 80.21a105.73 105.73 0 0 0 32.17 16.15 77.7 77.7 0 0 0 6.89-11.11 68.42 68.42 0 0 1-10.85-5.18c.91-.66 1.8-1.34 2.66-2a75.57 75.57 0 0 0 64.32 0c.87.71 1.76 1.39 2.66 2a68.68 68.68 0 0 1-10.87 5.19 77 77 0 0 0 6.89 11.1 105.25 105.25 0 0 0 32.19-16.14c2.64-27.38-4.51-51.11-18.9-72.15ZM42.45 65.69C36.18 65.69 31 60 31 53s5-12.74 11.43-12.74S54 46 53.89 53s-5.05 12.69-11.44 12.69Zm42.24 0C78.41 65.69 73.25 60 73.25 53s5-12.74 11.44-12.74S96.23 46 96.12 53s-5.04 12.69-11.43 12.69Z"
              />
            </svg>
            Continuer avec Discord
          </a>
        </div>
        <p class="login-note">Accès réservé aux membres ayant la permission « Gérer le serveur ».</p>
      </main>
    </div>

    <!-- ══════════ Application ══════════ -->
    <div id="app" class="app" hidden>
      <header class="mobilebar">
        <button id="nav-toggle" class="btn btn-ghost btn-icon" type="button" aria-label="Ouvrir la navigation" aria-controls="sidebar" aria-expanded="false"></button>
        <span id="mobile-title" class="mobilebar-title"></span>
        <button id="mobile-search" class="btn btn-ghost btn-icon" type="button" aria-label="Rechercher (Ctrl K)"></button>
      </header>

      <aside id="sidebar" class="sidebar" aria-label="Navigation principale">
        <div class="sb-head">
          <span id="guild-icon" class="sb-guild-icon"></span>
          <div class="sb-guild-text">
            <div id="guild-name" class="sb-guild-name">Serveur</div>
            <div class="sb-guild-sub">XK Bot</div>
          </div>
        </div>
        <button id="sb-search" class="sb-search" type="button">
          <span class="sb-search-label">Rechercher</span>
          <kbd class="kbd">Ctrl K</kbd>
        </button>
        <nav id="nav" class="nav" aria-label="Pages du dashboard"></nav>
        <div class="sb-foot">
          <button id="account-btn" class="account" type="button" aria-haspopup="menu" aria-expanded="false">
            <img id="user-avatar" class="avatar" src="/icon-192.png" alt="" width="24" height="24" />
            <span id="user-name" class="account-name"></span>
          </button>
        </div>
      </aside>
      <div id="scrim" class="scrim" hidden></div>

      <div class="main">
        <div id="conn-banner" class="conn-banner" role="status" hidden></div>
        <main id="content" class="content" tabindex="-1"></main>
      </div>

      <div id="savebar" class="savebar" hidden>
        <div class="savebar-inner" role="region" aria-label="Modifications non enregistrées">
          <span class="savebar-text">Modifications non enregistrées</span>
          <div class="savebar-actions">
            <button id="savebar-discard" class="btn btn-ghost btn-sm" type="button">Annuler</button>
            <button id="savebar-save" class="btn btn-primary btn-sm" type="button">Enregistrer</button>
          </div>
        </div>
      </div>
    </div>

    <div id="toasts" class="toasts"></div>

    <!--
      Scripts classiques (PAS des modules ES) : catgirl.js se greffe sur des
      fonctions globales du dashboard (toast, renderApp, renderOverview, showLogin).

      L'ORDRE EST SIGNIFICATIF : un fichier ne lit les `const` que des fichiers
      chargés avant lui. dash-core.js est chargé dans <head> (thème sans flash).
      Composants → formulaires → aperçus → coquille → pages → amorçage.
      `dash-boot.js` reste le dernier du dashboard ; catgirl.js se charge après.
    -->
    <script src="/dash-ui.js"></script>
    <script src="/dash-forms.js"></script>
    <script src="/dash-preview.js"></script>
    <script src="/dash-shell.js"></script>
    <script src="/dash-pages-overview.js"></script>
    <script src="/dash-pages-events.js"></script>
    <script src="/dash-pages-community.js"></script>
    <script src="/dash-pages-content.js"></script>
    <script src="/dash-pages-system.js"></script>
    <script src="/dash-pages-moderation.js"></script>
    <script src="/dash-boot.js"></script>
    <script src="/catgirl.js"></script>
  </body>
</html>
