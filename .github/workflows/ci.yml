name: CI

# Vérifie le code à chaque push et pull request : lint syntaxique + tests.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    # 20 = version du serveur de prod (fin de vie le 30/04/2026) ; 24 = LTS active, cible
    # de la prochaine migration du serveur. fail-fast: false : un echec sur 24 ne masque
    # pas le resultat sur 20 (et inversement).
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "24"]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint syntaxique (node --check)
        run: npm run check

      # ESLint est une devDependency : dispo ici (npm ci) mais PAS sur le serveur
      # de prod, qui installe avec --omit=dev. C'est pourquoi update.sh se limite
      # a `npm run check` et ne lance pas `npm run lint`.
      - name: Lint (ESLint)
        run: npm run lint

      - name: Tests (node --test)
        run: npm test
